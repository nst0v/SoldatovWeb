name: Prepare existing Pages preview
on:
  push:
    branches: ['publish/saytmsk']
permissions:
  contents: write
jobs:
  snapshot:
    if: github.ref == 'refs/heads/publish/saytmsk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run pages
      - name: Commit generated static snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Publish generated SAYTMSK snapshot for existing Pages site'
          git push origin HEAD:publish/saytmsk
