name: Import tested SAYTMSK
on:
  push:
    branches: ['rebuild/saytmsk']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-saytmsk
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/rebuild/saytmsk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified sources
        run: |
          python - <<'PY'
          import hashlib, io, lzma, tarfile, shutil
          from pathlib import Path
          pieces = [Path('.bootstrap') / f'part-{i}' for i in range(4)]
          if Path('.bootstrap').exists():
              raw = b''.join(p.read_bytes() for p in pieces)
              expected = 'debc7463c8d921192651e5d943ef59e425d2fa6d2d4a62806403e8d5814c3975'
              assert hashlib.sha256(raw).hexdigest() == expected, 'Source checksum mismatch'
              with tarfile.open(fileobj=io.BytesIO(lzma.decompress(raw)), mode='r:') as archive:
                  for member in archive.getmembers():
                      path = Path(member.name)
                      assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(archive.extractfile(member).read())
              shutil.rmtree('.bootstrap')
          else:
              assert Path('package.json').exists(), 'Sources are missing'
          PY
      - name: Install test tools
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          php -v
      - name: Capture actual demo sites
        run: python scripts/capture-work.py
      - name: Build and check generated pages
        run: npm run check
      - name: Check PHP guards without sending messages
        run: |
          php -l public/api/contact.php
          python tests/backend.py
      - name: Check browser over HTTP
        env:
          BROWSER_HTTP: '1'
        run: python tests/browser.py
      - name: Commit verified replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Replace legacy site with verified SAYTMSK website'
          git push origin HEAD:rebuild/saytmsk
      - name: Package website
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saytmsk-import-preview
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
